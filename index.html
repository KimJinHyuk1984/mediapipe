<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <meta name="color-scheme" content="light dark">
  <title>AI 운동 코치 만들기</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <script src="data/site.js" defer></script>
  <script src="assets/js/shared.js" defer></script>
</head>
<body data-accent="neon-green">
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./" data-site-title>AI 운동 코치 만들기</a>
      <div class="header-actions">
        <button class="button button-icon" type="button" data-theme-toggle aria-label="테마 전환">
          <svg data-theme-icon width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13a9 9 0 0 1-9.9-9.9A9 9 0 1 0 20.9 13Z"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main id="main" tabindex="-1" class="container">
    <section class="hero" aria-labelledby="site-title">
      <p class="kicker">PYTHON + MEDIAPIPE</p>
      <h1 id="site-title" data-site-title></h1>
      <p class="hero-subtitle" data-site-subtitle></p>
      <div class="hero-byline">
        <button class="text-button" type="button" data-open-instructor><span data-instructor-name></span> 선생님</button>
        <span data-instructor-affiliation></span>
      </div>
    </section>
    <section class="learning-path" aria-labelledby="path-title">
      <div class="section-heading">
        <p class="kicker">LEARNING PATH</p>
        <h2 id="path-title">하나의 동작에서, 여러 운동으로</h2>
        <p class="section-description">Level 1부터 차근차근 시작해 보세요.</p>
      </div>
      <ol class="level-path" data-level-cards></ol>
    </section>
    <section class="hub-instructor" aria-labelledby="instructor-title">
      <div data-instructor-avatar></div>
      <div>
        <p class="kicker">INSTRUCTOR</p>
        <h2 id="instructor-title"><span data-instructor-name></span> 선생님</h2>
        <p data-instructor-affiliation></p>
      </div>
      <button class="button button-primary" type="button" data-open-instructor>선생님 소개 보기</button>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container footer-grid">
      <div class="footer-instructor">
        <div data-instructor-avatar></div>
        <div>
          <strong data-instructor-name></strong>
          <p data-instructor-affiliation></p>
          <a class="footer-email" data-instructor-email></a>
        </div>
      </div>
      <div data-other-lectures-region>
        <h2 class="footer-heading">다른 강의 둘러보기</h2>
        <div class="other-lectures" data-other-lectures></div>
      </div>
    </div>
  </footer>
  <noscript>레벨 카드와 선생님 소개를 표시하려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
</body>
</html>
